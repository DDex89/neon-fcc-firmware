name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build vasm (6800 / Motorola syntax)
        run: |
          git clone https://github.com/StarWolf3000/vasm-mirror.git vasm
          cd vasm
          git checkout a13e7e728a3dd5a9ba468bf479119e0bc23e70fd
          make CPU=6800 SYNTAX=mot -j2
          echo "VASM=$PWD/vasm6800_mot" >> "$GITHUB_ENV"

      - name: Assemble and verify byte-identical images
        run: python3 tools/build.py

      - name: Assemble and verify the B559 images
        run: python3 tools/build.py --base B559

      - name: Assemble and verify the B4F3 and B4C2 images
        run: |
          python3 tools/build.py --base B4F3
          python3 tools/build.py --base B4C2
